<!-- templates/navbar.html -->
<nav class="fixed top-0 left-0 w-full bg-yellow-500 p-4 shadow-md flex justify-between items-center z-50">
    <!-- Logo -->
    <div class="flex items-center">
        <a href="{% url 'home' %}" class="flex items-center">
            <img src="https://en.wikipedia.org/wiki/Jan_Suraaj_Party#/media/File:Logo_of_Jan_Suraaj.jpg" alt="Logo" class="h-12 w-12 mr-2">
            <h1 class="text-xl font-bold text-white">Jansuraj Volunteers</h1>
        </a>
    </div>

    <!-- Mobile Menu Button -->
    <button id="menu-toggle" class="md:hidden text-white focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
        </svg>
    </button>

    <!-- Navigation Links -->
    <div id="nav-links" class="hidden md:flex space-x-4">
        {% if user.is_authenticated %}
            <a href="{% url 'tasks' %}" class="bg-white text-yellow-600 px-4 py-2 rounded-lg hover:bg-yellow-100">Assigned Tasks</a>
            <a href="{% url 'profile' %}" class="bg-white text-yellow-600 px-4 py-2 rounded-lg hover:bg-yellow-100">Profile</a>
            <a href="{% url 'logout' %}" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 ml-2">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="bg-white text-yellow-600 px-4 py-2 rounded-lg hover:bg-yellow-100">Login</a>
            <a href="{% url 'register' %}" class="bg-white text-yellow-600 px-4 py-2 rounded-lg hover:bg-yellow-100 ml-2">Register</a>
        {% endif %}
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden absolute top-16 left-0 w-full bg-yellow-500 p-4 shadow-lg space-y-2">
        {% if user.is_authenticated %}
            <a href="{% url 'tasks' %}" class="block text-white px-4 py-2 rounded-lg hover:bg-yellow-600">Assigned Tasks</a>
            <a href="{% url 'profile' %}" class="block text-white px-4 py-2 rounded-lg hover:bg-yellow-600">Profile</a>
            <a href="{% url 'logout' %}" class="block bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="block text-white px-4 py-2 rounded-lg hover:bg-yellow-600">Login</a>
            <a href="{% url 'register' %}" class="block text-white px-4 py-2 rounded-lg hover:bg-yellow-600">Register</a>
        {% endif %}
    </div>
</nav>

<script>
    document.getElementById('menu-toggle').addEventListener('click', function () {
        document.getElementById('mobile-menu').classList.toggle('hidden');
    });
</script>
