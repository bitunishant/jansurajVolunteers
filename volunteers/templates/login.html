{% extends 'base.html' %}
{% load static %}

{% block title %}Login - Jansuraj Volunteers{% endblock %}

{% block content %}
<div class="flex justify-center mt-16 flex-grow items-center px-4">
    <div class="bg-white shadow-xl rounded-lg p-10 w-full max-w-lg border border-gray-200">
        <h2 class="text-3xl font-semibold text-center text-gray-800">Login</h2>
        <hr class="my-4 border-t-2 border-gray-300">

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div class="space-y-4">
                {% for field in form %}
                    <div>
                        <label for="{{ field.id_for_label }}" class="block text-gray-700 font-medium mb-1">
                            {{ field.label }}
                        </label>
                        {{ field }}
                    </div>
                {% endfor %}
            </div>

            <button type="submit" class="w-full bg-yellow-500 text-white py-3 px-4 rounded-lg text-lg font-semibold hover:bg-yellow-600 transition duration-300">
                Login
            </button>
        </form>

        <p class="text-center text-gray-600 mt-6">
            Don't have an account? 
            <a href="{% url 'register' %}" class="text-yellow-600 font-semibold hover:underline">
                Register
            </a>
        </p>
    </div>
</div>

<style>
    input[type="text"], input[type="password"], input[type="email"] {
        @apply w-full border border-gray-300 rounded-lg px-4 py-2 text-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500;
    }
    input::placeholder {
        color: #a1a1a1;
    }
</style>

{% endblock %}
