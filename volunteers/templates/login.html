<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - Jansuraj Volunteers</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white flex flex-col min-h-screen">
    
    {% include 'navbar.html' %}  <!-- Navbar added at the top -->

    <div class="flex justify-center mt-16 flex-grow items-center">
        <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
            <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="w-full bg-yellow-500 text-white py-2 px-4 rounded-lg hover:bg-yellow-600">
                    Login
                </button>
            </form>
            <p class="text-center text-gray-600 mt-4">
                Don't have an account? <a href="{% url 'register' %}" class="text-yellow-600 font-semibold">Register</a>
            </p>
        </div>
    </div>
  <!-- Footer -->
  {% include 'footer.html' %}   
</body>
</html>
