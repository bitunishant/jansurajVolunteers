{% extends 'base.html' %}
{% load static %}

{% block title %}Product List - Your Shop{% endblock %}

{% block content %}
<div class="flex justify-center mt-16 flex-grow items-center px-4">
    <div class="bg-white shadow-xl rounded-lg p-10 w-full max-w-3xl border border-gray-200">
        <h2 class="text-3xl font-semibold text-center text-gray-800">Our Products</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-8">
            <!-- Sample Product 1 -->
            <div class="product bg-white shadow-lg rounded-lg p-4 text-center flex flex-col justify-between h-full">
                <div>
                    <img src="https://picsum.photos/200/300" alt="Product 1" class="w-full h-48 object-cover mb-4">
                    <h3 class="text-xl font-semibold text-gray-800">Wireless Headphones</h3>
                    <p class="text-lg text-gray-600">₹79.99</p>
                </div>
                <form action="#" method="post" class="mt-4">
                    <button type="submit" class="btn bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded">
                        Add to Cart
                    </button>
                </form>
            </div>

            <!-- Sample Product 2 -->
            <div class="product bg-white shadow-lg rounded-lg p-4 text-center flex flex-col justify-between h-full">
                <div>
                    <img src="https://picsum.photos/200/300" alt="Product 2" class="w-full h-48 object-cover mb-4">
                    <h3 class="text-xl font-semibold text-gray-800">Smartphone</h3>
                    <p class="text-lg text-gray-600">₹399.99</p>
                </div>
                <form action="#" method="post" class="mt-4">
                    <button type="submit" class="btn bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded">
                        Add to Cart
                    </button>
                </form>
            </div>

            <!-- Sample Product 3 -->
            <div class="product bg-white shadow-lg rounded-lg p-4 text-center flex flex-col justify-between h-full">

                    <img src="https://picsum.photos/200/300" alt="Product 3" class="w-full h-48 object-cover mb-4">
                    <h3 class="text-xl font-semibold text-gray-800">Smart Watch</h3>
                    <p class="text-lg text-gray-600">₹149.99</p>
                </div>
                <form action="#" method="post" class="mt-4">
                    <button type="submit" class="btn bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded">
                        Add to Cart
                    </button>
                </form>
            </div>

            <!-- Sample Product 4 -->

                    <button type="submit" class="btn bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded">
                        Add to Cart
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
